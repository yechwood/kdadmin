services:
  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8080
      DATA_DIR: /data
    volumes:
      - kodroid_data:/data
    expose:
      - "8080"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
volumes:
  kodroid_data:
  caddy_data:
  caddy_config:
